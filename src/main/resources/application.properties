# ================================================
# CubeSolve Backend - Application Configuration
# ================================================
# In production, set DB_HOST, DB_USERNAME, DB_PASSWORD, JWT_SECRET, and CORS_ALLOWED_ORIGINS
# via secure environment variables or a secrets manager.

spring.application.name=cubesolve-backend

# -----------------------------------------------
# Server
# -----------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------
# MySQL DataSource
# -----------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cubesolve_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------
# JPA / Hibernate
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -----------------------------------------------
# JWT Configuration
# -----------------------------------------------
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWN1YmVzb2x2ZS0yMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------
# CORS Configuration
# -----------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://cube-solver-front-end.vercel.app}

# -----------------------------------------------
# Logging
# -----------------------------------------------
logging.level.com.cubesolve=INFO
logging.level.com.cubesolve=INFO
logging.level.org.springframework.security=WARN
