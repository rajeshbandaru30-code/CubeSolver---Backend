# ================================================
# CubeSolve Backend - Application Configuration
# ================================================
# In production, set DB_HOST, DB_USERNAME, DB_PASSWORD, JWT_SECRET, and CORS_ALLOWED_ORIGINS
# via secure environment variables or a secrets manager.

spring.application.name=cubesolve-backend

# -----------------------------------------------
# Server
# -----------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------
# MySQL DataSource & HikariCP Connection Pool
# -----------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cubesolve_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Bounded HikariCP configuration optimized for 512MB RAM instances (Render)
spring.datasource.hikari.pool-name=CubeSolveHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=45000

# -----------------------------------------------
# JPA / Hibernate
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# -----------------------------------------------
# JWT Configuration
# -----------------------------------------------
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWN1YmVzb2x2ZS0yMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------
# CORS Configuration
# -----------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://cube-solver-front-end.vercel.app}

# -----------------------------------------------
# Logging
# -----------------------------------------------
logging.level.com.cubesolve=INFO
logging.level.com.cubesolve=INFO
logging.level.org.springframework.security=WARN
